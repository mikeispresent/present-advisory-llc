<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Present Advisory LLC</title>
    <meta name="description" content="Present Advisory LLC. Venture development and small business advisory. Chicago, IL.">
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html { 
            height: 100%; 
            background-color: #f8f8f7;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8f8f7;
            min-height: 100dvh;
            width: 100%;
            display: flex;
            flex-direction: column;
            color: #2c2c2c;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 40px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .company-name {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #1a1a1a;
            margin-bottom: 16px;
            text-align: center;
        }

        .tagline {
            font-size: 1rem;
            font-weight: 400;
            color: #666;
            margin-bottom: 32px;
            text-align: center;
            font-style: italic;
        }

        .location {
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .contact-link {
            font-size: 0.95rem;
            color: #2c2c2c;
            text-decoration: none;
            border-bottom: 1px solid #ccc;
            padding-bottom: 2px;
            transition: border-color 0.2s ease;
        }

        .contact-link:hover {
            border-color: #2c2c2c;
        }

        .legal-footer {
            width: 100%;
            text-align: center;
            padding: 30px 20px;
            padding-bottom: max(30px, env(safe-area-inset-bottom));
        }

        .copyright {
            font-size: 0.75rem;
            color: #999;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <h1 class="company-name">Present Advisory LLC</h1>
        <p class="tagline">Venture development and small business advisory</p>
        <p class="location">Chicago, IL</p>
        <a href="mailto:mike@presentadvisory.com" class="contact-link">mike@presentadvisory.com</a>
    </div>

    <div class="legal-footer">
        <p class="copyright">© 2025 Present Advisory LLC. All rights reserved.</p>
    </div>

</body>
</html>
